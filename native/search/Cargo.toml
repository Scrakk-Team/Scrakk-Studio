[package]
name = "scrakk-search"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
serde_json = "1"
rayon = "1"
regex = "1"
ignore = "0.4"
notify = "6"
tgrep-core = { path = "../tgrep/tgrep-core" }

[build-dependencies]
napi-build = "2"
