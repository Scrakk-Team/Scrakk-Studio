[workspace]
members = ["kolargrep-core", "kolargrep-cli"]
resolver = "2"

[workspace.package]
version = "1.0.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/tgrep"
authors = ["Shengyu Fu"]

[workspace.dependencies]
kolargrep-core = { path = "kolargrep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
