# Empaquetado Electron — pensado para ENTREGAR builds.
#
# Objetivo: que el artefacto no filtre más de lo necesario.
#  - asar con solo lo de runtime (nada de fuentes, docs, tests, tools, secretos).
#  - sin sourcemaps (los delata prod: `sourcemap: false` en electron-vite.prod).
#  - nativo fuera del asar (node-pty / *.node) para que cargue.
#  - el icono vive en `assets/scrakk-studio-b.png` — el MISMO que pinta la ventana
#    (`getAppIcon()`). Un solo icono para las tres plataformas y para la ventana.
#    `build-resources/` está en .gitignore, así que en CI no existía y
#    electron-builder caía al icono por defecto de Electron ("default Electron
#    icon is used") — el bug del icono en Windows.
#
# Firma de código (win/mac) se agrega cuando haya certificados. ASAR integrity
# se controla desde el main (ver EnableEmbeddedAsarIntegrityValidation).

appId: art.scrakk.studio
productName: Scrakk Studio
copyright: Copyright © Scrakk
author: Scrakk Studio <founder@scrakk.art>
homepage: https://scrakk.art

# Auto-update (electron-updater). Con esto electron-builder escribe
# `app-update.yml` en resources (el provider que lee el updater) y genera los
# metadatos `latest*.yml` + blockmaps, que el workflow sube al Release con
# `files: release/*`. No publica solo: el workflow usa `--publish never`.
publish:
  provider: github
  # El repo canónico es Scrakk-Team/Scrakk-Studio. Con `Scrakk` dependíamos de
  # un redirect de GitHub: si esa cuenta se libera, el updater podría recibir
  # un `latest.yml` ajeno.
  owner: Scrakk-Team
  repo: Scrakk-Studio

directories:
  output: release
  buildResources: build-resources

# Nombre estable para TODOS los artefactos. Sin esto, electron-builder escribe
# un `latest.yml` con un nombre distinto al del asset real y el auto-update de
# Windows termina en 404. `tools/release/feed.mjs` lo verifica en el release.
artifactName: "Scrakk-Studio-${version}.${ext}"

asar: true

# Fuses de Electron (se aplican al empaquetar). Sin esto, cualquiera puede
# reabrir la app empaquetada como Node (`ELECTRON_RUN_AS_NODE`) o inyectar
# `NODE_OPTIONS`/`--inspect` para ejecutar código en el proceso main.
electronFuses:
  # Necesario para lanzar el Extension Host como Node puro con `--permission`
  # (el `utilityProcess` de Electron no aplica el modelo de permisos).
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
# Fuera del asar: todo lo que el sistema operativo tiene que abrir como ARCHIVO
# REAL, no como ruta virtual del archivo.
#  - los .node (nativos) no pueden ejecutarse desde adentro del asar;
#  - node-pty (nativo + prebuilds);
#  - los scripts que se lanzan como PROCESO HIJO con `utilityProcess.fork`
#    (host de extensiones y worker de tree-sitter). Si quedan adentro, algunas
#    distros (SELinux, noexec…) no los pueden ejecutar y la capa de extensiones
#    —y con ella los .scm del resaltado— no arranca nunca.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/node-pty/**'
  # web-tree-sitter lo carga el worker de tree-sitter con un `require` de nivel
  # superior. El worker corre DESEMPACADO (ver spawnEntry.ts) y Node NO resuelve
  # módulos que están adentro del asar desde una ruta desempacada: sin esto el
  # worker moría al arrancar con "Cannot find module 'web-tree-sitter'" y el
  # editor quedaba SIN COLOR en todo build empaquetado (en dev no hay asar, por
  # eso ahí funcionaba).
  - '**/node_modules/web-tree-sitter/**'
  - out/main/extension-host.js
  # El host corre como Node puro (sandbox `--permission`), sin el parche asar
  # de Electron: sus chunks tienen que estar desempacados o el require falla.
  - out/main/chunks/**
  - out/main/tree-sitter-worker.js
  - out/main/*.node

# Lenguajes tree-sitter PREINSTALADOS: una carpeta por lenguaje con su wasm +
# queries. El IDE los lee on-demand como una extensión; el motor ya NO trae
# gramáticas embebidas (se regeneran con `node tools/build-langs.mjs`).
extraResources:
  # Icono de la app en runtime (window icon en Windows/Linux). `assets/` está
  # EXCLUIDO de `files`, así que hay que copiarlo a resources/ para que
  # `getAppIcon()` (main-window.ts) lo encuentre en el build empaquetado —
  # sin esto el window icon queda undefined y Windows muestra el icono de
  # Electron en la taskbar/título.
  - from: assets
    to: assets
    filter:
      - scrakk-studio-b.png
  - from: langs
    to: langs
    filter:
      - '**/*'
  # Sidecar de búsqueda (`kolargrep serve`). Se compila con
  # `npm run native:kolargrep`; si falta, la búsqueda cae al addon nativo/TS.
  - from: native/kolargrep/target/release
    to: .
    filter:
      - 'kolargrep'
      - 'kolargrep.exe'

# node-pty se reconstruye contra Electron; si el entorno no tiene toolchain,
# se puede forzar false y usar el binario ya compilado en node_modules.
npmRebuild: false

# Solo lo que corre. Todo lo demás (fuentes, docs, tests, tools, secretos) NO
# entra al paquete.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.md'
  - '!**/.env*'
  - '!**/.dev.vars*'
  - '!docs/**'
  - '!tests/**'
  - '!tools/**'
  - '!native/**'
  - '!files-otherapps/**'
  - '!BorealChat-tauri/**'
  - '!.opencode/**'
  - '!.github/**'
  - '!**/tsconfig*.json'
  - '!**/vitest.config.*'
  - '!**/electron.vite.config.*'

linux:
  target:
    - AppImage
    - deb
    # tar.gz: el paquete portable para quien no usa gestor de paquetes ni
    # AppImage (FUSE). Es el mismo linux-unpacked comprimido.
    - tar.gz
  category: Development
  icon: assets/scrakk-studio-b.png
  # Asocia las ventanas al .desktop (WM_CLASS) en Linux.
  syncDesktopName: true
  # Dependencias de runtime de Electron en Debian/Ubuntu.
  depends:
    - libnss3
    - libatk1.0-0
    - libatk-bridge2.0-0
    - libcups2
    - libdrm2
    - libgtk-3-0
    - libxkbcommon0
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libgbm1
    - libasound2
    - libpango-1.0-0
    - libcairo2
    - libx11-6
    - libxext6
    - libxfixes3
    - libxss1
    - libglib2.0-0
  deb:
    # Nombre del paquete en dpkg/apt: `apt install scrakk-studio`.
    packageName: scrakk-studio
    section: utils
    priority: optional

win:
  target:
    - nsis
  icon: assets/scrakk-studio-b.png

nsis:
  # Explícito para que `latest.yml` y el asset real usen el MISMO nombre.
  artifactName: "Scrakk-Studio-${version}.${ext}"

# Solo Windows y Linux. No hay target macOS ni se publican artefactos para él.
