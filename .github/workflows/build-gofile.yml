name: Build (test) → Gofile

# Compila el .exe para PROBARLO en Windows y lo sube a Gofile. NO es un release:
# no hay tag, ni GitHub Release, ni fila en Supabase, ni aviso a los usuarios.
#
# Disparo: push a master (siempre) o manual (Actions → Run workflow, cualquier rama).
# `concurrency` cancela el build anterior si pusheás de nuevo: siempre queda el
# link del commit más nuevo.
on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: build-gofile-master
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts` + el install explícito de Electron: un postinstall de
      # una dependencia no debe ejecutar código en el runner. node-pty trae su
      # prebuild en el paquete, así que el .exe sigue arrancando.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: El lockfile no cambió
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Empaquetar (.exe)
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe
          path: release/*.exe
          if-no-files-found: error

  upload-gofile:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-exe
          path: exe

      - name: Subir a Gofile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::error::falta el secret GOFILE_TOKEN (gh secret set GOFILE_TOKEN)"; exit 1
          fi

          EXE=$(ls exe/*.exe | head -1)
          SERVER=$(curl -fsS https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Subiendo $(basename "$EXE") a $SERVER…"

          RESP=$(curl -fsS \
            -F "file=@$EXE" \
            -H "Authorization: Bearer $GOFILE_TOKEN" \
            "https://$SERVER.gofile.io/contents/uploadfile")
          echo "$RESP" | jq .

          STATUS=$(echo "$RESP" | jq -r '.status')
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Gofile respondió: $STATUS"; exit 1
          fi
          URL=$(echo "$RESP" | jq -r '.data.downloadPage')

          {
            echo "### ⬇️ Descargá el .exe (test build)"
            echo ""
            echo "- **Archivo:** $(basename "$EXE")"
            echo "- **Link:** $URL"
            echo ""
            echo "_No firmado → SmartScreen: Más información → Ejecutar de todos modos._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Gofile: $URL"
