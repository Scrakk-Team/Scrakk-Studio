name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Permitir scripts de instalación (electron)
        run: npm config set ignore-scripts false

      - name: Instalar dependencias
        run: |
          npm install --ignore-scripts
          node node_modules/electron/install.js

      # node-pty no publica prebuild para linux-x64 (solo win32/darwin). Como
      # el install del CI corre con --ignore-scripts, sin este paso el paquete
      # sale SIN `build/Release/pty.node` y la app no arranca
      # ("Failed to load native module: pty.node"). Es N-API (node-addon-api),
      # así que compilarlo con el Node del runner alcanza: el binario es
      # ABI-estable y Electron lo carga igual.
      - name: Compilar node-pty
        run: |
          npm rebuild node-pty
          test -f node_modules/node-pty/build/Release/pty.node

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Empaquetar (linux)
        run: npx electron-builder --linux AppImage deb tar.gz --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install

      # Guarda: el .exe necesita el binario nativo. En Windows sale del
      # prebuild (win32-x64); si faltara, el paquete no arrancaría.
      - name: Verificar node-pty
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/node-pty/prebuilds/win32-x64/pty.node")) {
            throw "falta node-pty/prebuilds/win32-x64/pty.node"
          }

      - name: Typecheck
        run: npm run typecheck

      # Sin tests en Windows: la suite completa gatea en el job linux.
      # grammar-cli rompe la colección bajo vitest+win32 (import .ts-desde-.mjs)
      # y hay casos POSIX-only; se corre build + empaquetado del .exe.
      - name: Build
        run: npm run build

      - name: Empaquetar (windows)
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Notas = el `docs/changelog/changelog-<versión>.md` de esta versión (sin
      # la cabecera genérica del archivo). Si falta, queda el tag.
      - name: Preparar notas del release
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="docs/changelog/changelog-${VERSION}.md"
          if [ -f "$FILE" ]; then
            sed -n '/^## /,$p' "$FILE" > release-notes.md
          else
            echo "::warning::no existe $FILE; el release queda sin notas"
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: false
          name: ${{ github.ref_name }}
          body_path: release-notes.md

      # Aviso en vivo: la fila entra en Supabase y el IDE la recibe por
      # Realtime (no hay polling). Sin secretos, se omite sin romper el release.
      - name: Registrar la release en Supabase
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ufcwwigmzgmyyfauymim.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::faltan SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY; se omite el aviso en vivo"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BODY="$(cat release-notes.md)"
          PAYLOAD="$(jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg version "$VERSION" \
            --arg name "$GITHUB_REF_NAME" \
            --arg body "$BODY" \
            --arg html_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            '{tag:$tag,version:$version,name:$name,body:$body,html_url:$html_url}')"
          STATUS="$(curl -sS -o /tmp/sb-response.txt -w "%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/releases" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$PAYLOAD")"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Supabase respondió $STATUS: $(cat /tmp/sb-response.txt)"
            exit 1
          fi
          echo "release ${VERSION} registrada en Supabase ($STATUS)"
