name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Permitir scripts de instalación (electron)
        run: npm config set ignore-scripts false

      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      # Una release construida con un árbol distinto al del lockfile es
      # irreproducible: si algo toca el lockfile aquí, que falle ya.
      - name: El lockfile no cambió
        run: git diff --exit-code -- package-lock.json

      # node-pty no publica prebuild para linux-x64 (solo win32/darwin). Como
      # el install del CI corre con --ignore-scripts, sin este paso el paquete
      # sale SIN `build/Release/pty.node` y la app no arranca
      # ("Failed to load native module: pty.node"). Es N-API (node-addon-api),
      # así que compilarlo con el Node del runner alcanza: el binario es
      # ABI-estable y Electron lo carga igual.
      - name: Compilar node-pty
        run: |
          npm rebuild node-pty
          test -f node_modules/node-pty/build/Release/pty.node

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Un release NO sale con traducciones incompletas o sin revisar.
      - name: i18n (bloqueante)
        run: node tools/i18n.mjs --check --strict

      - name: Build
        run: npm run build

      - name: Empaquetar (linux)
        run: npx electron-builder --linux AppImage deb tar.gz --publish never

      - name: Auditar el paquete (sin sourcemaps ni secretos)
        run: npm run pack:audit -- release/linux-unpacked/resources/app.asar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            release/*
            !release/builder-debug.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` conserva los install-scripts (a diferencia del job de linux, aquí
      # los hacen falta: electron baja su binario y node-pty trae su prebuild).
      - name: Instalar dependencias
        run: npm ci

      - name: El lockfile no cambió
        run: git diff --exit-code -- package-lock.json

      # Guarda: el .exe necesita el binario nativo. En Windows sale del
      # prebuild (win32-x64); si faltara, el paquete no arrancaría.
      - name: Verificar node-pty
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/node-pty/prebuilds/win32-x64/pty.node")) {
            throw "falta node-pty/prebuilds/win32-x64/pty.node"
          }

      - name: Typecheck
        run: npm run typecheck

      # El motivo histórico para no correr tests aquí ("grammar-cli rompe la
      # colección bajo vitest+win32") era en realidad un problema que NO era de
      # plataforma: un shebang `#!/usr/bin/env node` en un módulo ESM, que el
      # transform SSR de Vite dejaba huérfano. Ya está corregido y la suite
      # pasa en windows-latest, así que aquí se corre también.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Empaquetar (windows)
        run: npx electron-builder --win nsis --publish never

      - name: Auditar el paquete (sin sourcemaps ni secretos)
        run: npm run pack:audit -- release/win-unpacked/resources/app.asar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            release/*
            !release/builder-debug.yml

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      # El `latest*.yml` tiene que apuntar a archivos que existen. Sin esto,
      # Windows descarga una URL 404 y el auto-update queda roto en silencio.
      - name: Verificar feed de actualizaciones
        run: npm run release:verify

      # Notas = el `docs/changelog/changelog-<versión>.md` de esta versión (sin
      # la cabecera genérica del archivo). Si falta, queda el tag.
      - name: Preparar notas del release
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="docs/changelog/changelog-${VERSION}.md"
          if [ -f "$FILE" ]; then
            sed -n '/^## /,$p' "$FILE" > release-notes.md
          else
            echo "::warning::no existe $FILE; el release queda sin notas"
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Crear Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: false
          name: ${{ github.ref_name }}
          body_path: release-notes.md

      # Aviso en vivo: la fila entra en Supabase y el IDE la recibe por
      # Realtime (no hay polling). Sin secretos, se omite sin romper el release.
      - name: Registrar la release en Supabase
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ufcwwigmzgmyyfauymim.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::faltan SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY; se omite el aviso en vivo"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BODY="$(cat release-notes.md)"
          PAYLOAD="$(jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg version "$VERSION" \
            --arg name "$GITHUB_REF_NAME" \
            --arg body "$BODY" \
            --arg html_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            '{tag:$tag,version:$version,name:$name,body:$body,html_url:$html_url}')"
          STATUS="$(curl -sS -o /tmp/sb-response.txt -w "%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/releases" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$PAYLOAD")"
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Supabase respondió $STATUS: $(cat /tmp/sb-response.txt)"
            exit 1
          fi
          echo "release ${VERSION} registrada en Supabase ($STATUS)"

  publish-apt:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: apt-repo
          path: apt-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolver versión
        id: v
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apt: v$VERSION"

      - name: Agregar versión a versions.txt
        shell: bash
        working-directory: apt-repo
        run: |
          touch versions.txt
          if ! grep -qx "${{ steps.v.outputs.version }}" versions.txt; then
            echo "${{ steps.v.outputs.version }}" >> versions.txt
          fi
          cat versions.txt

      - name: Generar repositorio APT
        shell: bash
        working-directory: apt-repo
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::falta APT_GPG_PRIVATE_KEY; se omite la firma del repo apt"
            exit 0
          fi
          node ../src/tools/apt/build-repo.mjs --versions versions.txt --out .

      - name: Publicar en Cloudflare Pages (apt.scrakk.art)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: eaa65e50775620523cf9a829e7b465a5
          projectName: scrakk-apt
          directory: apt-repo
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit y push a apt-repo (historial)
        shell: bash
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios; nada que commitear"
            exit 0
          fi
          git commit -m "apt: Scrakk Studio ${{ steps.v.outputs.version }}"
          git push origin apt-repo
