name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Permitir scripts de instalación (electron)
        run: npm config set ignore-scripts false

      - name: Instalar dependencias
        run: |
          npm install --ignore-scripts
          node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Empaquetar (linux)
        run: npx electron-builder --linux AppImage deb tar.gz --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # Sin tests en Windows: la suite completa gatea en el job linux.
      # grammar-cli rompe la colección bajo vitest+win32 (import .ts-desde-.mjs)
      # y hay casos POSIX-only; se corre build + empaquetado del .exe.
      - name: Build
        run: npm run build

      - name: Empaquetar (windows)
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: false
          name: ${{ github.ref_name }}
          body: ${{ github.ref_name }}
