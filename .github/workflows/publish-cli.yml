name: publish-cli

# Publishes @scrakk-official/cli to npm when a `cli-v*` tag is pushed.
# Auth is npm Trusted Publishing (OIDC) — no token is stored in the repo.
# The same run attaches a registry-free fallback (cli.tgz + install.sh) to the
# GitHub Release.

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

permissions:
  contents: write # attach the fallback asset to the GitHub Release
  id-token: write # mint the OIDC token for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          npm pack
          mv scrakk-official-cli-*.tgz cli.tgz

      # Fallback: keep a downloadable tarball on the GitHub Release.
      - name: Attach release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/cli/cli.tgz
            packages/cli/install.sh

      # Primary: publish to npm via Trusted Publishing (OIDC, no token).
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public
