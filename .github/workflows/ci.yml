name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # El postinstall de electron necesita correr en CI.
      - name: Permitir scripts de instalación (electron)
        run: npm config set ignore-scripts false

      # `npm ci`, no `npm install`: instala exactamente lo que dice el
      # lockfile. Con `npm install` + rangos caret el CI flotaba sobre minors, y
      # una actualización de vite rompió el build sin que nadie tocara el repo.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      # Si una herramienta reescribió el lockfile, el build no es reproducible:
      # hay que enterarse en el PR, no tres meses después.
      - name: El lockfile no cambió
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Aviso (no bloquea) mientras el catálogo se migra. Cuando la cobertura
      # sea completa, pasar a --strict para exigir traducciones al día.
      - name: i18n (cobertura de traducciones)
        run: node tools/i18n.mjs --check

      - name: Build
        run: npm run build

  # La app se distribuye también en Windows, y la suite tiene tests que tocan el
  # filesystem de verdad (instalación atómica de extensiones, cuentas, LSP). Con
  # un solo job en Linux, un test que sólo rompiera en win32 pasaba inadvertido:
  # `panel-header-effects.test.ts` construía rutas con `URL.pathname`, que en
  # Windows devuelve `/C:/...` y revienta con ENOENT al hacer `scandir`.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Permitir scripts de instalación (electron)
        run: npm config set ignore-scripts false

      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: El lockfile no cambió
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      # 2 suites se saltan aquí por diseño: `terminal-font-stack` y
      # `tree-sitter-tokenizer` requieren `fc-match` (fontconfig), que no
      # existe en Windows. Se declaran en el propio archivo; no es cobertura
      # oculta, pero conviene tenerlo presente al leer el resultado.
      - name: Tests
        run: npm test
